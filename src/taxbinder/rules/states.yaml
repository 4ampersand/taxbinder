# State income tax table: every state and DC.
#
# Drafted from each state's own pages (`page`); not reviewed. Whoever checks an entry against
# its page sets `reviewed_by` and `reviewed_at` on it; until then the app labels that state's
# dates "not reviewed". A state's dates in rules/params/<year>.yaml, if any, win over this table.
#
# estimated: the installment due dates as the state publishes them, "MM-DD" (a January or
#   February date is in the year after the tax year); moved to the next business day after a
#   weekend or federal holiday when a year's dates are worked out (`states.py`).
# quarters: which estimated_qN each date is, when not 1-4 (California has no third).
# shares: each installment's share of the year's payment, when not equal.
# An empty `estimated` means the state doesn't require estimated payments (see `note`).
# `income_tax: false` means only that the state doesn't tax wages and investment income;
# never that there's nothing to do (property, sales and other taxes aren't covered here).

