# Contributor License Agreement: on a contributor's first pull request, asks them to sign CLA.md
# with a comment; signatures are kept on the `cla-signatures` branch of this repository.
# pull_request_target is safe here: the job never checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the signature
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # contributor-assistant/github-action v2.6.1, pinned to its commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/4ampersand/taxbinder/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: shahid11885,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/4ampersand/taxbinder/blob/main/CLA.md)
            and sign it by posting the comment below. You only need to do this once.
